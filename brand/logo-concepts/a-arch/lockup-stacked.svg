<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 480" width="440" height="480">
  <title>עשור רואות חשבון</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&amp;family=Heebo:wght@400;500&amp;display=swap');
    .word { font-family: 'Frank Ruhl Libre', 'Noto Serif Hebrew', serif; font-weight: 700; }
    .tag  { font-family: 'Heebo', 'Assistant', sans-serif; font-weight: 500; }
  </style>
  <!-- mark -->
  <svg x="100" y="10" width="240" height="240" viewBox="0 0 512 512">
    <g transform="translate(0 -14)">
      <path d="M 90 470 V 214 A 166 166 0 0 1 422 214 V 470" fill="none" stroke="#a8894f" stroke-width="16"/>
      <rect x="74" y="484" width="364" height="16" fill="#a8894f"/>
      <path d="M 120 470 V 214 A 136 136 0 0 1 392 214 V 470 Z" fill="#6e1a2d"/>
      <g fill="#fbf7f4">
        <path d="M 290 176 H 354 V 214 L 290 206 Z"/>
        <path d="M 160 176 H 222 V 214 L 160 206 Z"/>
      </g>
      <g fill="none" stroke="#fbf7f4" stroke-linejoin="round">
        <path d="M 336 200 V 318 C 336 364 312 384 266 384 H 156" stroke-width="38"/>
        <path d="M 196 200 L 328 365" stroke-width="28"/>
      </g>
    </g>
  </svg>
  <!-- wordmark -->
  <text class="word" x="220" y="352" direction="rtl" text-anchor="middle" font-size="130" fill="#6e1a2d">עשור</text>
  <rect x="160" y="382" width="120" height="3" fill="#a8894f"/>
  <text class="tag" x="220" y="440" direction="rtl" text-anchor="middle" font-size="38" letter-spacing="5" fill="#8a6a2f">רואות חשבון</text>
</svg>
