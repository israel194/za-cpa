name = "za-cpa-leads"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
CORS_ORIGINS = "https://za-cpa.com,https://www.za-cpa.com,http://localhost:5188,http://localhost:5190"
OFFICE_EMAIL = "office@za-cpa.com"
ORIT_EMAIL = "orit@za-cpa.com"
EMAIL_FROM = "אתר עשור רואי חשבון <website@za-cpa.com>"
OFFICE_PHONE = "02-5000275"

# Per-IP limit on lead submissions (Workers Rate Limiting binding).
[[ratelimits]]
name = "LEAD_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secret (not stored here):  npx wrangler secret put RESEND_API_KEY
